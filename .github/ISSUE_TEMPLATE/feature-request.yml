name: Feature request
description: Propose a new capability or improvement.
title: "[feat]: "
labels:
  - type:feat
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Dextree follows a vertical-slice
        workflow — accepted feature requests usually become a SpecKit spec
        before implementation begins.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's hard or impossible today? Describe the situation, not the solution.
      placeholder: |
        When I'm reviewing a large monorepo, I cannot easily see which files
        import a given symbol across packages.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would Dextree behave if this feature shipped? Focus on user-visible behavior, not implementation.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Primary surface(s)
      description: Where would this feature appear?
      multiple: true
      options:
        - VS Code extension (graph view)
        - VS Code extension (commands / tree views)
        - Exporters (Mermaid / PNG / PDF / SVG / Canvas)
        - MCP server
        - CLI
        - Embeddable web component
        - Alfred (LLM-driven)
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why you'd reject them.

  - type: textarea
    id: success
    attributes:
      label: Definition of done
      description: How would we know this feature is finished? Ideally a user-facing, measurable outcome.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I've checked open issues and discussions; this is not a duplicate.
        - label: I'm willing to help draft the SpecKit spec for this feature.
        - label: I'm willing to implement this if accepted.
