name: Setup Dextree workspace
description: Install pnpm 11.1.2, set up Node 22, and install dependencies (frozen lockfile). Caller must run actions/checkout first.

inputs:
  node-version:
    description: Node version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: "11.1.2"
        run_install: false

    - name: Setup Node ${{ inputs.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
