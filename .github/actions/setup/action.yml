name: Setup Dextree workspace
description: Install pnpm 11.1.2, set up Node 22.22.1+, install dependencies (frozen lockfile), and configure Turborepo remote cache via GitHub Actions cache. Caller must run actions/checkout first.

inputs:
  node-version:
    description: Node version to install.
    required: false
    default: "22.22.1"
  turbo-cache:
    description: Set to "false" to skip configuring the Turborepo remote cache (e.g. for jobs that do not invoke turbo).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: "11.1.2"
        run_install: false

    - name: Setup Node ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Turborepo remote cache backed by GitHub Actions cache. Lets parallel
    # CI jobs share build/typecheck/test outputs across runners. Falls back
    # silently when the action is unavailable; turbo just runs without cache.
    - name: Configure Turborepo remote cache
      if: inputs.turbo-cache == 'true'
      uses: dtinth/setup-github-actions-caching-for-turbo@cc723b4600e40a6b8815b65701d8614b91e2669e # v1.3.0
