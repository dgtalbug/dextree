name: static-checks

# Consolidated job that runs prettier + eslint + tsc in a single runner.
# Each individual check is cheap (~1s of work) but spawning three separate
# runners costs ~30s of cold-start + setup each. One job, three steps,
# one setup cache. Replaces the former _format.yml, _lint.yml, _typecheck.yml
# reusable workflows.

on:
  workflow_call:

# Least-privilege default — overridden per-job only when a job needs more.
permissions:
  contents: read

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Prettier check
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: No spec-tracking tags in source
        run: pnpm lint:spec-tags
      - name: TypeScript
        run: pnpm typecheck
      - name: pnpm dedupe check
        run: pnpm dedupe --check
