name: Stale

on:
  schedule:
    # Daily at 03:00 UTC. GitHub's actions/stale processes ~30 items per run
    # to stay under rate limits; daily catches up gracefully.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: mark-and-close
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Stale issues + PRs
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: 30
          days-before-close: 30
          stale-issue-message: |
            This issue has had no activity for 30 days. It will be closed in
            30 more days unless someone responds. If this is still relevant,
            add a comment to keep it open.
          stale-pr-message: |
            This PR has had no activity for 30 days. It will be closed in
            30 more days unless updated. Rebase or comment to keep it open.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: blocked,help wanted,good first issue,phase:1,phase:2,phase:3
          exempt-pr-labels: blocked,dependencies
          exempt-draft-pr: true
          operations-per-run: 100
