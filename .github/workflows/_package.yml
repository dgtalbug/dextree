name: package

on:
  workflow_call:

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Turbo build
        # Turbo remote cache (configured in setup composite) makes this a
        # near-noop when the parallel `build` job has already produced + cached
        # the dist outputs. On cold cache it does the real build.
        run: pnpm build
      - name: Package .vsix
        run: pnpm package
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dextree-vsix
          path: packages/extension/*.vsix
          if-no-files-found: error
          retention-days: 14
