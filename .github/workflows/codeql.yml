name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Narrowed from top-level to job-level per OpenSSF Token-Permissions.
      # security-events: write is required so codeql-action/analyze can upload
      # SARIF results to the Security tab. actions: read lets the action
      # inspect prior workflow runs for incremental analysis.
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: javascript-typescript
          # javascript-typescript extractor scans sources directly — no build
          # required. build-mode: none skips trace setup and shaves ~30s.
          build-mode: none
          # Use the security-extended query suite; default queries are
          # too narrow for an extension that bundles third-party WASM.
          queries: security-extended
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: "/language:javascript-typescript"
