name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    # Weekly, Monday 06:00 UTC. Intentionally NOT on every PR — too slow.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Initialize CodeQL
        uses: github/codeql-action/init@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended query suite; default queries are
          # too narrow for an extension that bundles third-party WASM.
          queries: security-extended
      - name: Build (for CodeQL trace)
        run: pnpm build
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
        with:
          category: "/language:${{ matrix.language }}"
