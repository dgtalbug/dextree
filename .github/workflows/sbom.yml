name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the SBOM to (e.g. v0.1.0).
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: cyclonedx
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Narrowed from top-level to job-level per OpenSSF Token-Permissions.
      # contents: write is required for `gh release upload` to attach the
      # generated SBOM artifact to the existing GitHub release.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Generate CycloneDX SBOM
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom.cyclonedx.json
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          gh release upload "$TAG" sbom.cyclonedx.json --clobber
