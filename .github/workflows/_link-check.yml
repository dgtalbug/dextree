name: link-check

on:
  workflow_call:

# Least-privilege default — overridden per-job only when a job needs more.
permissions:
  contents: read

jobs:
  link-check:
    name: link-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --exclude 'https?://localhost'
            --exclude 'file://'
            --exclude 'mailto:'
            --exclude-path './CHANGELOG.md'
            './**/*.md'
          fail: true
