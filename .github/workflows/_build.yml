name: build

on:
  workflow_call:

# Least-privilege default — overridden per-job only when a job needs more.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Turbo build
        # Runs in parallel with `test` and `package`. The turbo remote cache
        # (configured in setup composite) shares outputs across the three jobs
        # — whichever finishes first warms the cache for the others.
        run: pnpm build
