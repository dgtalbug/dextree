name: PR size label

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

# pull_request_target gives write tokens even on fork PRs. We deliberately do
# NOT check out the PR head — the size labeler reads diff metadata via the
# API and never executes untrusted PR code.
permissions:
  pull-requests: write

jobs:
  label:
    name: size-label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Apply size label
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff # v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORED: |
            pnpm-lock.yaml
            **/*.snap
            **/dist/**
            **/build/**
            **/coverage/**
        with:
          sizes: >
            {
              "0": "size: XS",
              "10": "size: S",
              "100": "size: M",
              "400": "size: L",
              "1000": "size: XL"
            }
