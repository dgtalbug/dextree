name: test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token. Optional; upload is best-effort.
        required: false

# Least-privilege default — overridden per-job only when a job needs more.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Vitest with coverage
        # `pnpm test:coverage` runs `turbo run build` first, which is a near-noop
        # cache-hit when the parallel `build` job has already pushed to the
        # turbo remote cache. On a cold cache it does the real build itself.
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: unittests
