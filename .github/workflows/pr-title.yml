name: PR title

# pull_request_target runs with write tokens even on fork PRs. We deliberately
# do NOT check out the PR head — this workflow only reads the PR title from
# event metadata and never executes untrusted PR code. Permissions are
# scoped read-only on pull-requests.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  lint:
    name: conventional-commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types match CLAUDE.md / CONTRIBUTING.md.
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
          # Scopes are advisory — release-please uses them for changelog grouping.
          requireScope: false
          # PR title prefix sanity. Examples that should pass:
          #   feat(core): add DuckPGQ query layer
          #   fix(extension): handle missing workspace folder
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject must not start with an uppercase character.
            Use lowercase: e.g. "feat(core): add DuckPGQ query layer".
