name: Claude handoff

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

# Maintainer-triggered: a comment containing "@claude" (or a maintainer
# assigning Claude to an issue) hands the task to the Claude Code Action.
# Permissions match what the action needs to open PRs and update issues.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  handoff:
    name: claude-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Check ANTHROPIC_API_KEY presence
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY not configured; claude-handoff is a no-op."
            exit 0
          fi
      - name: Run Claude Code Action
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        uses: anthropics/claude-code-action@99ca333651aa9a8becc279065fad21c4ef1c4494 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
