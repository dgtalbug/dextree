name: Fuzzing

# Continuous fuzzing via Jazzer.js.
# Runs on every push to main and weekly to catch regressions.
# Each target gets a fixed 30-second corpus-exploration budget so the job
# completes in well under the 10-minute timeout.
#
# OpenSSF Scorecard "Fuzzing" check detects @jazzer.js/core in package.json
# *and* a workflow that exercises it — both are present after this commit.

on:
  push:
    branches:
      - main
  schedule:
    # Weekly, Wednesday 05:00 UTC.
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - packages/exporters/src/__fuzz__/serializer.fuzz.ts
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - name: Build exporters (and its workspace dependencies)
        run: pnpm turbo build --filter=@dextree/exporters...

      - name: Compile fuzz targets
        # Jazzer.js resolves targets as plain .js; use tsup (already used by
        # this package) to bundle each fuzz target to dist/__fuzz__/ so that
        # module aliases and workspace deps resolve correctly.
        run: |
          pnpm --filter @dextree/exporters exec tsup \
            src/__fuzz__/serializer.fuzz.ts \
            --format esm --out-dir dist/__fuzz__ --no-dts --target node22

      - name: Run fuzzer (${{ matrix.target }})
        # --timeout limits each individual input; --fuzz_time limits the total
        # corpus exploration run so CI does not block indefinitely.
        # Map matrix target (packages/PKG/src/__fuzz__/FOO.ts) to compiled JS
        # (packages/PKG/dist/__fuzz__/FOO.js).
        run: |
          COMPILED=$(echo "${{ matrix.target }}" \
            | sed 's|^\(packages/[^/]*/\)src/__fuzz__/\(.*\)\.ts$|\1dist/__fuzz__/\2.js|')
          npx jazzer "$COMPILED" \
            --timeout=5000 \
            -- \
            -max_total_time=30 \
            -print_final_stats=1
