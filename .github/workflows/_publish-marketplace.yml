name: _publish-marketplace

# Reusable workflow. Not directly triggerable — invoked by release.yml via
# workflow_call. Publishes the bundled .vsix to the VS Code Marketplace.

on:
  workflow_call:
    inputs:
      version:
        description: Semver version being published.
        required: true
        type: string
      vsix-artifact-name:
        description: Name of the .vsix artifact uploaded by build-vsix.
        required: true
        type: string
    secrets:
      VSCE_PAT:
        description: Azure DevOps PAT for the marketplace publisher.
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: vsce publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Secrets guard
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCE_PAT secret is empty. Configure it in repo secrets before publishing."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Download .vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/extension
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: packages/extension
        run: |
          # Find the single .vsix file produced by build-vsix.
          VSIX="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          if [ -z "$VSIX" ]; then
            echo "::error::No .vsix found in packages/extension"
            exit 1
          fi
          echo "Publishing $VSIX (version ${{ inputs.version }}) to VS Code Marketplace"
          pnpm dlx @vscode/vsce publish --packagePath "$VSIX" --no-dependencies --pat "$VSCE_PAT"
