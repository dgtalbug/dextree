name: Pre-release

# Manual canary path. Builds a .vsix and attaches it to a GitHub draft release.
# Does NOT publish to the VS Code Marketplace or Open VSX — use release.yml
# for live publishes.

on:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Pre-release tag (e.g. v0.1.0-canary.1). Must include the leading "v".
        required: true
        type: string
      release_notes:
        description: Optional inline release notes (markdown).
        required: false
        type: string
        default: "Canary pre-release. Not for production use."

permissions:
  contents: read

concurrency:
  group: pre-release-${{ inputs.prerelease_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Validate tag format
        run: |
          if ! echo "${{ inputs.prerelease_tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Pre-release tag must match v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi

  build-vsix:
    name: build-vsix (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Package .vsix (${{ matrix.target }})
        env:
          VSCE_TARGET: ${{ matrix.target }}
        run: pnpm package
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dextree-vsix-${{ inputs.prerelease_tag }}-${{ matrix.target }}
          path: packages/extension/*.vsix
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: draft-release
    needs: build-vsix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # contents: write is required so `gh release create --draft` can mint
      # a new draft GitHub release and attach the matrix-built .vsix files.
      # Scoped to this job only; the workflow's top-level perm is `contents: read`.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download all .vsix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: dextree-vsix-${{ inputs.prerelease_tag }}-*
          merge-multiple: true
      - name: Create or update draft GitHub release with all .vsix files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each matrix target produced one .vsix in artifacts/. Attach them all.
          mapfile -t VSIX_PATHS < <(find artifacts -maxdepth 1 -name '*.vsix')
          if [ "${#VSIX_PATHS[@]}" -eq 0 ]; then
            echo "::error::No .vsix files downloaded from artifacts"
            exit 1
          fi
          printf 'Attaching: %s\n' "${VSIX_PATHS[@]}"
          if gh release view "${{ inputs.prerelease_tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.prerelease_tag }}" "${VSIX_PATHS[@]}" --clobber
          else
            gh release create "${{ inputs.prerelease_tag }}" "${VSIX_PATHS[@]}" \
              --draft \
              --prerelease \
              --title "${{ inputs.prerelease_tag }} (canary)" \
              --notes "${{ inputs.release_notes }}"
          fi
