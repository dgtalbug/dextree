name: Pre-release

# Manual canary path. Builds a .vsix and attaches it to a GitHub draft release.
# Does NOT publish to the VS Code Marketplace or Open VSX — use release.yml
# for live publishes.

on:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Pre-release tag (e.g. v0.1.0-canary.1). Must include the leading "v".
        required: true
        type: string
      release_notes:
        description: Optional inline release notes (markdown).
        required: false
        type: string
        default: "Canary pre-release. Not for production use."

permissions:
  contents: write

concurrency:
  group: pre-release-${{ inputs.prerelease_tag }}
  cancel-in-progress: false

jobs:
  build-and-draft:
    name: build-and-draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Validate tag format
        run: |
          if ! echo "${{ inputs.prerelease_tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Pre-release tag must match v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
      - name: Package .vsix
        run: pnpm package
      - name: Locate .vsix
        id: vsix
        run: |
          VSIX_PATH="$(find packages/extension -maxdepth 1 -name '*.vsix' -print -quit)"
          if [ -z "$VSIX_PATH" ]; then
            echo "::error::No .vsix produced"
            exit 1
          fi
          echo "path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
      - name: Create draft GitHub release with .vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: if the tag already has a draft, update; else create.
          if gh release view "${{ inputs.prerelease_tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.prerelease_tag }}" "${{ steps.vsix.outputs.path }}" --clobber
          else
            gh release create "${{ inputs.prerelease_tag }}" "${{ steps.vsix.outputs.path }}" \
              --draft \
              --prerelease \
              --title "${{ inputs.prerelease_tag }} (canary)" \
              --notes "${{ inputs.release_notes }}"
          fi
