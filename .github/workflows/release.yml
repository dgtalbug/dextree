name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish.
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Narrowed from top-level to job-level per OpenSSF Token-Permissions.
      # release-please needs contents: write to push the release commit and tag,
      # and pull-requests: write to open / update the release PR. Sibling jobs
      # (build-vsix / publish-*) declare their own narrower perms.
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Single-package release — root package.json holds the source of truth.
          # If you later split into per-package releases, add release-please-config.json
          # and manifest.json files at repo root.
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

  build-vsix:
    name: build-vsix (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for actions/attest-build-provenance to mint a keyless
      # Sigstore signature via OIDC. Provenance is attached to the GitHub
      # release attestations endpoint — verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Package .vsix (${{ matrix.target }})
        env:
          VSCE_TARGET: ${{ matrix.target }}
        run: pnpm package
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/extension/*.vsix
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dextree-vsix-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
          path: packages/extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  publish-marketplace:
    name: publish-marketplace (${{ matrix.target }})
    needs:
      - release-please
      - build-vsix
      - publish-openvsx
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    uses: ./.github/workflows/_publish-marketplace.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      vsix-artifact-name: dextree-vsix-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: publish-openvsx (${{ matrix.target }})
    needs:
      - release-please
      - build-vsix
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    uses: ./.github/workflows/_publish-openvsx.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      vsix-artifact-name: dextree-vsix-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
