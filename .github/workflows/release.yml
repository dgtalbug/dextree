name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish.
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Narrowed from top-level to job-level per OpenSSF Token-Permissions.
      # release-please needs contents: write to push the release commit and tag,
      # and pull-requests: write to open / update the release PR. Sibling jobs
      # (build-vsix / publish-*) declare their own narrower perms.
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      # Mint a short-lived installation token from the Dextree release GitHub App
      # so the release PR is authored under the App identity. Required to bypass
      # GitHub's GITHUB_TOKEN cascade safeguard, which suppresses on:pull_request
      # workflow runs for PRs opened by the default GITHUB_TOKEN. Without this,
      # CI never fires on the release PR (see PRs #122, #125 history).
      #
      # Setup (one-time, documented in the PR that introduced this step):
      #   1. Register a private GitHub App on the org/account.
      #   2. Grant it repo permissions: contents=write, pull-requests=write.
      #   3. Install it on dgtalbug/dextree.
      #   4. Generate a PEM private key from the App settings.
      #   5. Add repo secrets:
      #        - RELEASE_APP_ID            (the App's numeric ID)
      #        - RELEASE_APP_PRIVATE_KEY   (full PEM file content, including
      #                                     -----BEGIN/END PRIVATE KEY----- lines)
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Explicit least-privilege scoping. The App's installation
          # permissions already match these, but pinning them at the call site
          # narrows the minted token if the App's scope ever widens. Flagged
          # by zizmor static analysis (rule: github-app) and CodeRabbit on
          # PR #126.
          permission-contents: write
          permission-pull-requests: write
      - name: release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Single-package release — root package.json holds the source of truth.
          # If you later split into per-package releases, add release-please-config.json
          # and manifest.json files at repo root.
          release-type: node
          # App-minted token (not GITHUB_TOKEN) so the release PR is authored
          # under the App identity — that triggers on:pull_request workflows on
          # the bot PR normally instead of hitting the cascade safeguard.
          token: ${{ steps.app-token.outputs.token }}

  build-vsix:
    name: build-vsix (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Required for actions/attest-build-provenance to mint a keyless
      # Sigstore signature via OIDC. Provenance is attached to the GitHub
      # release attestations endpoint — verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Stamp extension version
        # release-please updates root package.json; stamp the same version
        # into packages/extension/package.json so the vsix is built correctly.
        # Use an env var to avoid shell-quoting issues inside the node -e heredoc.
        env:
          DEXTREE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'packages/extension/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.DEXTREE_VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Stamped version', pkg.version, 'into', p);
          "
      - name: Turbo build
        # Build every workspace package first so the extension's vite build
        # can resolve deep imports like `@dextree/core/lenses` to dist files
        # that exist. pnpm does not auto-build linked workspace packages;
        # the extension's local `prepackage` only runs the extension's own
        # `pnpm build`, which leaves `packages/core/dist/query/lenses.js`
        # absent and breaks the webview bundle. _package.yml (PR CI) already
        # does this; release.yml was missing it.
        run: pnpm build
      - name: Package .vsix (${{ matrix.target }})
        env:
          VSCE_TARGET: ${{ matrix.target }}
        run: pnpm package
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: packages/extension/*.vsix
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dextree-vsix-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
          path: packages/extension/*.vsix
          if-no-files-found: error
          retention-days: 30
      - name: Attach .vsix to GitHub Release
        # Attaching the vsix to the release makes the artifact discoverable
        # via the Releases page and satisfies the OpenSSF Scorecard Packaging check.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            packages/extension/*.vsix \
            --clobber

  publish-marketplace:
    name: publish-marketplace (${{ matrix.target }})
    needs:
      - release-please
      - build-vsix
      - publish-openvsx
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    uses: ./.github/workflows/_publish-marketplace.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      vsix-artifact-name: dextree-vsix-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: publish-openvsx (${{ matrix.target }})
    needs:
      - release-please
      - build-vsix
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - win32-x64
    uses: ./.github/workflows/_publish-openvsx.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      vsix-artifact-name: dextree-vsix-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
