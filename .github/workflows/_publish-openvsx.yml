name: _publish-openvsx

# Reusable workflow. Not directly triggerable — invoked by release.yml via
# workflow_call. Publishes the bundled .vsix to Open VSX.

on:
  workflow_call:
    inputs:
      version:
        description: Semver version being published.
        required: true
        type: string
      vsix-artifact-name:
        description: Name of the .vsix artifact uploaded by build-vsix.
        required: true
        type: string
    secrets:
      OVSX_PAT:
        description: Open VSX namespace PAT. Optional — job skips gracefully when not set.
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: ovsx publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Secrets guard
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT secret is not set — skipping Open VSX publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: guard
      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup workspace
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/setup
      - name: Download .vsix artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/extension
      - name: Publish to Open VSX
        if: steps.guard.outputs.skip != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        working-directory: packages/extension
        run: |
          VSIX="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          if [ -z "$VSIX" ]; then
            echo "::error::No .vsix found in packages/extension"
            exit 1
          fi
          echo "Publishing $VSIX (version ${{ inputs.version }}) to Open VSX"
          pnpm dlx ovsx publish "$VSIX" --pat "$OVSX_PAT"
