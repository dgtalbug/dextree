name: Link check (scheduled)

# Weekly sweep across the whole docs tree. The PR-time variant lives in
# `_link-check.yml` and is invoked by `ci.yml`.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  call:
    uses: ./.github/workflows/_link-check.yml
