name: CI

# Orchestrator. Calls each gate as a reusable workflow so the Checks tab
# shows one expandable `CI` row with one pill per gate. Gate implementations
# live in their own `_*.yml` files so each can also be invoked independently
# (e.g. from `release.yml`) or manually.
#
# Master switches:
#   - To temporarily disable a gate, add `if: false` to its job below.
#   - Path-filtered gates (spell-check, link-check, dependency-review) are
#     gated by `paths-filter` outputs so they only run when relevant files
#     change.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # -- Path filter ----------------------------------------------------------
  # Sets outputs that downstream jobs gate themselves on. Avoids running
  # spell-check / link-check on code-only PRs and dep-review on doc-only PRs.
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.lychee.toml'
              - '.typos.toml'
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/*/package.json'

  # -- Always-on gates ------------------------------------------------------
  format:
    name: format
    uses: ./.github/workflows/_format.yml

  lint:
    name: lint
    uses: ./.github/workflows/_lint.yml

  typecheck:
    name: typecheck
    uses: ./.github/workflows/_typecheck.yml

  test:
    name: test
    uses: ./.github/workflows/_test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: build
    uses: ./.github/workflows/_build.yml

  package:
    name: package
    needs: build
    uses: ./.github/workflows/_package.yml

  # -- Conditional gates (path-filtered) ------------------------------------
  dependency-review:
    name: dependency-review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/_dependency-review.yml

  spell-check:
    name: spell-check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/_spell-check.yml

  link-check:
    name: link-check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/_link-check.yml
