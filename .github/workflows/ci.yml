name: CI

# Orchestrator. Calls each gate as a reusable workflow so the Checks tab
# shows one expandable `CI` row with one pill per gate. Gate implementations
# live in their own `_*.yml` files so each can also be invoked independently
# (e.g. _link-check.yml is also called by link-check.yml on a weekly cron).
#
# To temporarily disable a gate, add `if: false` to its job below.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # static-checks and link-check only run on PRs — they already passed before
  # merge, re-running them on push-to-main wastes ~2 min of runner time per merge.
  static-checks:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_static-checks.yml

  # build, test, and package all run in parallel. Each invokes `pnpm build`
  # via turbo, which shares outputs across jobs through the turbo remote cache
  # (see .github/actions/setup). Whichever job's build finishes first warms
  # the cache for the others — a cold cache pays one real build, every
  # subsequent run is a near-noop.
  build:
    uses: ./.github/workflows/_build.yml

  test:
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  package:
    uses: ./.github/workflows/_package.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_dependency-review.yml

  spell-check:
    uses: ./.github/workflows/_spell-check.yml

  link-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_link-check.yml
