name: CI

# Orchestrator. Calls each gate as a reusable workflow so the Checks tab
# shows one expandable `CI` row with one pill per gate. Gate implementations
# live in their own `_*.yml` files so each can also be invoked independently
# (e.g. _link-check.yml is also called by link-check.yml on a weekly cron).
#
# To temporarily disable a gate, add `if: false` to its job below.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # static-checks and link-check only run on PRs — they already passed before
  # merge, re-running them on push-to-main wastes ~2 min of runner time per merge.
  static-checks:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_static-checks.yml

  # build, test, and package wait for static-checks so a formatting/lint/tsc
  # failure fast-fails the pipeline before spinning up expensive runners.
  # On push-to-main static-checks is skipped (already passed on the PR) and
  # GitHub treats a skipped job as success, so these jobs still run normally.
  # All three run in parallel once unblocked. Each invokes `pnpm build` via
  # turbo — whichever finishes first warms the remote cache for the others.
  build:
    needs: static-checks
    uses: ./.github/workflows/_build.yml

  test:
    needs: static-checks
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  package:
    needs: static-checks
    uses: ./.github/workflows/_package.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_dependency-review.yml

  spell-check:
    uses: ./.github/workflows/_spell-check.yml

  link-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_link-check.yml
